name: Run extended memory smoke

on:
  push:
    paths:
      - .github/workflows/run-extended-memory-smoke.yml

permissions:
  contents: read

jobs:
  memory-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run extended memory smoke
        env:
          JACKAL_MEMORY_WARMUP_CYCLES: 10
          JACKAL_MEMORY_CYCLES: 80
        run: npm run memory:smoke
