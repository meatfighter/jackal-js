name: Format Player TypeScript

on:
  push:
    paths:
      - .github/workflows/format-player-ts.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Player
        run: npx prettier pwa/src/jackal/Player.ts --write

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa/src/jackal/Player.ts
          if git diff --cached --quiet; then
            echo "Player.ts already formatted."
            exit 0
          fi
          git commit -m "Format Player rumble update"
          git push
