name: Regenerate Java float metadata

on:
  push:
    paths:
      - .github/workflows/regenerate-java-float-metadata.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Regenerate metadata
        run: node scripts/java-float-parity/generate-java-float-metadata.mjs

      - name: Commit generated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/java-float-parity/java-float-metadata.jsonl
          if git diff --cached --quiet; then
            echo "Metadata already current."
            exit 0
          fi
          git commit -m "Regenerate Java float metadata"
          git push
