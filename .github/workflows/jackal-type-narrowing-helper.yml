name: Jackal Type Narrowing Helper

on:
  push:
    branches:
      - chatgpt/jackal-prepublic-hardening-20260905
    paths:
      - .github/workflows/jackal-type-narrowing-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/jackal-prepublic-hardening-20260905
      - name: Make main-field narrowing explicit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('pwa/src/jackal/persistence/GameStateSnapshotValidator.ts')
          text = path.read_text()
          old = '''    if (!isEncodedRecord(snapshot.playerFields, entityIds) || !isEncodedRecord(gameMode.fields, entityIds)) {\n        return false;\n    }\n    if (gameMode.fields.stageIndex !== snapshot.mainFields.stageIndex) {\n        return false;\n    }\n'''
          new = '''    const mainFields = snapshot.mainFields;\n    if (!isEncodedRecord(snapshot.playerFields, entityIds) || !isEncodedRecord(gameMode.fields, entityIds) || !isEncodedRecord(mainFields)) {\n        return false;\n    }\n    if (gameMode.fields.stageIndex !== mainFields.stageIndex) {\n        return false;\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one narrowing block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - run: npx prettier pwa/src/jackal/persistence/GameStateSnapshotValidator.ts --write
      - run: |
          git config user.name "zeroone"
          git config user.email "54445200+meatfighter@users.noreply.github.com"
          git add pwa/src/jackal/persistence/GameStateSnapshotValidator.ts
          git commit -m "Fix Jackal save validator narrowing"
          git push origin HEAD:chatgpt/jackal-prepublic-hardening-20260905
