name: Apply September 2026 maintenance

on:
    push:
        paths:
            - ".github/workflows/apply-2026-09-maintenance.yml"

permissions:
    contents: write

jobs:
    apply:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.13.0
                  cache: npm

            - name: Set up Java
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven

            - name: Install current dependencies
              run: npm ci

            - name: Normalize migration inputs and preserve source newlines
              run: python .github/scripts/apply-2026-09-preflight.py

            - name: Apply maintenance
              run: python .github/scripts/apply-2026-09-maintenance.py

            - name: Align post-migration fixup expectations
              run: |
                  python - <<'PY'
                  from pathlib import Path
                  path = Path('.github/scripts/apply-2026-09-fixups.py')
                  text = path.read_text()
                  text = text.replace('GAME_STATE_VERSION\\\\s*=\\\\s*7', 'GAME_STATE_VERSION\\\\s*=\\\\s*8')
                  text = text.replace('GAME_STATE_VERSION = 7 as const/);', 'GAME_STATE_VERSION = 7 as const;/);')
                  text = text.replace('GAME_STATE_VERSION = \\\\d+ as const/);', 'GAME_STATE_VERSION = \\\\d+ as const;/);')
                  text = text.replace("replace_count(web_path, 'this.showPendingPersistenceWarning();', 'this.persistenceWarnings.showPending();', 2)", "replace_count(web_path, 'this.showPendingPersistenceWarning();', 'this.persistenceWarnings.showPending();', 3)")
                  text = text.replace("replace_once(\n    lock_path,\n    '    rmSync(detachedDir, { recursive: true, force: true });',", "replace_count(\n    lock_path,\n    '    rmSync(detachedDir, { recursive: true, force: true });',")
                  text = text.replace("'    rmSync(detachedDir, { recursive: true, force: true, maxRetries: cleanupRetryCount, retryDelay: cleanupRetryDelayMs });',\n)\nreplace_once(lock_path", "'    rmSync(detachedDir, { recursive: true, force: true, maxRetries: cleanupRetryCount, retryDelay: cleanupRetryDelayMs });',\n    2,\n)\nreplace_once(lock_path")
                  path.write_text(text)
                  PY

            - name: Apply validation fixups
              run: python .github/scripts/apply-2026-09-fixups.py

            - name: Finalize lock cleanup and scaling ownership
              run: |
                  python - <<'PY'
                  from pathlib import Path
                  import re

                  lock_path = Path('scripts/release-lock-utils.mjs')
                  lock = lock_path.read_text()
                  old = '''    markOwnerReleased(lockDir, owner);\n    const detachedDir = await detachLockDirectoryWithRetry(lockDir, "released");\n    if (detachedDir === null || detachedDir === false) {\n        return;\n    }\n'''
                  new = '''    const detachedDir = await detachLockDirectoryWithRetry(lockDir, "released");\n    if (detachedDir === null) {\n        return;\n    }\n    if (detachedDir === false) {\n        const currentOwner = readOwner(lockDir);\n        if (currentOwner.status === "valid" && currentOwner.token === token) {\n            markOwnerReleased(lockDir, currentOwner);\n        }\n        return;\n    }\n'''
                  if lock.count(old) != 1:
                      raise SystemExit('Unexpected owned-lock cleanup block.')
                  lock_path.write_text(lock.replace(old, new, 1))

                  picker_path = Path('pwa/src/app/ScalingPicker.ts')
                  picker = picker_path.read_text()
                  picker = 'import type { BufferedScalingMode } from "slick2d-ts";\n' + picker
                  anchor = '''export function bindScalingPicker(\n'''
                  helper = '''export function bufferedScalingModeForPreference(\n    slick: typeof import("slick2d-ts"),\n    preference: JackalScalingPreference\n): BufferedScalingMode {\n    switch (preference) {\n        case "crisp":\n            return slick.BufferedScalingMode.Nearest;\n        case "pixel-perfect":\n            return slick.BufferedScalingMode.Integer;\n        case "smooth":\n        default:\n            return slick.BufferedScalingMode.Linear;\n    }\n}\n\n'''
                  if picker.count(anchor) != 1:
                      raise SystemExit('Unexpected ScalingPicker bind anchor.')
                  picker_path.write_text(picker.replace(anchor, helper + anchor, 1))

                  web_path = Path('pwa/src/app/JackalWebApp.ts')
                  web = web_path.read_text()
                  web = web.replace('import type { BufferedScalingMode } from "slick2d-ts";\n', '')
                  web = web.replace('type SlickRuntimeModule = typeof import("slick2d-ts");\n', '')
                  old_import = 'import { bindScalingPicker, scalingPickerHtml } from "./ScalingPicker.js";'
                  new_import = 'import { bindScalingPicker, bufferedScalingModeForPreference, scalingPickerHtml } from "./ScalingPicker.js";'
                  if web.count(old_import) != 1:
                      raise SystemExit('Unexpected ScalingPicker import in JackalWebApp.')
                  web = web.replace(old_import, new_import, 1)
                  web = web.replace('this.getBufferedScalingMode(', 'bufferedScalingModeForPreference(')
                  method = re.compile(r'\n    private getBufferedScalingMode\(slick: SlickRuntimeModule\): BufferedScalingMode \{[\s\S]*?\n    \}\n\n    private resetPwaState')
                  web, count = method.subn('\n    private resetPwaState', web, count=1)
                  if count != 1:
                      raise SystemExit('Unable to extract buffered scaling mapping from JackalWebApp.')
                  web_path.write_text(web)
                  PY

            - name: Synchronize dependencies and generated parity metadata
              run: |
                  npm install --ignore-scripts
                  npm run generate:java-float-metadata
                  npm run generate:java-float-state
                  npm run format

            - name: Prepare candidate commit
              shell: bash
              run: |
                  git add -A
                  git diff --cached --check
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -m "Apply Jackal parity and PWA maintenance"

            - name: Verify complete release build
              run: npm run build

            - name: Verify real browser behavior
              run: npm run verify:browser

            - name: Publish maintenance commit
              shell: bash
              run: |
                  git rm .github/workflows/apply-2026-09-maintenance.yml .github/scripts/apply-2026-09-maintenance.py .github/scripts/apply-2026-09-preflight.py .github/scripts/apply-2026-09-fixups.py
                  git commit --amend --no-edit
                  git push
