name: Apply September 2026 maintenance

on:
    push:
        paths:
            - ".github/workflows/apply-2026-09-maintenance.yml"

permissions:
    contents: write

jobs:
    apply:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.13.0
                  cache: npm

            - name: Set up Java
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven

            - name: Install current dependencies
              run: npm ci

            - name: Harden migration inputs
              run: python .github/scripts/apply-2026-09-preflight.py

            - name: Apply maintenance
              run: python .github/scripts/apply-2026-09-maintenance.py

            - name: Synchronize dependencies and generated parity metadata
              run: |
                  npm install --ignore-scripts
                  npm run generate:java-float-metadata
                  npm run generate:java-float-state
                  npm run format

            - name: Prepare candidate commit
              shell: bash
              run: |
                  git add -A
                  git diff --cached --check
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -m "Apply Jackal parity and PWA maintenance"

            - name: Verify complete release build
              run: npm run build

            - name: Verify real browser behavior
              run: npm run verify:browser

            - name: Publish maintenance commit
              shell: bash
              run: |
                  git rm .github/workflows/apply-2026-09-maintenance.yml .github/scripts/apply-2026-09-maintenance.py .github/scripts/apply-2026-09-preflight.py
                  git commit --amend --no-edit
                  git push
