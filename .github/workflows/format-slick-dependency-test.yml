name: Format Slick dependency test

on:
    push:
        paths:
            - ".github/workflows/format-slick-dependency-test.yml"

permissions:
    contents: write

jobs:
    format-and-verify:
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: 22.13.0
                  cache: npm
            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "21"
            - run: npm ci
            - name: Format and commit clean candidate
              run: |
                  set -euo pipefail
                  npx prettier scripts/test-public-release-hardening.mjs --write
                  rm .github/workflows/format-slick-dependency-test.yml
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add scripts/test-public-release-hardening.mjs .github/workflows/format-slick-dependency-test.yml
                  git diff --cached --check
                  git commit -m "Format immutable HTTPS dependency guard"
            - run: npm run verify:dependencies
            - run: npm run build
            - run: npm run verify:browser
            - name: Publish verified formatting
              run: git push origin HEAD:main
