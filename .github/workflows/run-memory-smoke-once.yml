name: Format memory smoke diagnostic

on:
  push:
    paths:
      - .github/workflows/run-memory-smoke-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format memory smoke diagnostic
        run: npx prettier scripts/run-memory-smoke.mjs --write

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-memory-smoke.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Format memory smoke diagnostic"
          git push
