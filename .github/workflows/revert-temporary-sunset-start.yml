name: Revert temporary sunset start

on:
  push:
    paths:
      - .github/workflows/revert-temporary-sunset-start.yml

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Revert temporary ending-scene startup hook
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_bytes(path, old, new, expected=1):
              p = Path(path)
              data = p.read_bytes()
              count = data.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}")
              p.write_bytes(data.replace(old, new))

          replace_bytes(
              "desktop/src/jackal/Main.java",
              b"requestMode(Modes.SUNSET, gc);",
              b"requestMode(Modes.INTRO, gc);",
          )

          replace_bytes(
              "pwa/src/jackal/Main.ts",
              b"this.loadingCompleteHandler(this.gc);",
              b"loadingHandled = this.loadingCompleteHandler(this.gc) === true;",
          )
          replace_bytes(
              "pwa/src/jackal/Main.ts",
              b"this.requestMode(Modes.SUNSET, this.gc);",
              b"this.requestMode(Modes.INTRO, this.gc);",
          )
          PY

      - name: Verify restored builds
        run: |
          npm run typecheck
          npm run build:desktop

      - name: Commit restored startup behavior
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src/jackal/Main.java pwa/src/jackal/Main.ts
          git commit -m "Revert temporary sunset startup test"
          git push
