name: TypeScript Release Cleanup Helper

on:
  push:
    branches:
      - chatgpt/ts-release-cleanup-20260905
    paths:
      - .github/workflows/ts-release-cleanup-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/ts-release-cleanup-20260905
      - name: Apply behavior-neutral TypeScript cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('pwa/src/jackal/Main.ts')
          text = main.read_text()
          old = '    javaFloat,\n    javaInt,\n    javaIntDiv\n'
          new = '    javaFloat,\n    javaIntDiv\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one unused javaInt import, found {text.count(old)}')
          main.write_text(text.replace(old, new))

          helicopter = Path('pwa/src/jackal/FriendlyHelicopter.ts')
          text = helicopter.read_text()
          dead = '''    private static readonly Z_GROUND: number = 1;\n    private static readonly Z_SKY: number = 0;\n\n'''
          if text.count(dead) != 1:
              raise SystemExit(f'expected one dead Z constant pair, found {text.count(dead)}')
          helicopter.write_text(text.replace(dead, ''))

          config = Path('pwa/tsconfig.json')
          text = config.read_text()
          old = '        "noImplicitOverride": true,\n'
          new = '        "noImplicitOverride": true,\n        "noUnusedLocals": true,\n'
          if text.count(old) != 1 or '"noUnusedLocals"' in text:
              raise SystemExit('unexpected tsconfig noUnusedLocals state')
          config.write_text(text.replace(old, new))
          PY
      - name: Commit source cleanup
        run: |
          git config user.name "zeroone"
          git config user.email "54445200+meatfighter@users.noreply.github.com"
          git add pwa/src/jackal/Main.ts pwa/src/jackal/FriendlyHelicopter.ts pwa/tsconfig.json
          git commit -m "Remove dead Jackal TypeScript residue"
          git push origin HEAD:chatgpt/ts-release-cleanup-20260905
