name: Apply sunset fixed timing

on:
  push:
    paths:
      - .github/workflows/apply-sunset-fixed-timing.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Apply Java and TypeScript sunset timing changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}\n--- OLD ---\n{old}")
              p.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          java = "desktop/src/jackal/SunsetMode.java"
          replace_once(java,
          '''  public static final int SUN_HEIGHT = 92;
          public static final float SUN_AMPLITUDE = 2f;
          public static final float SUN_WAVES = 3f;
          public static final int WAVES_HEIGHT = 32;
                  
          public static final float[] sunOffsets = new float[SUN_HEIGHT];
          
          static {    
            final float PERCENT = (float)(SUN_WAVES * 2 * Math.PI / SUN_HEIGHT);
            
            for(int i = 0; i < SUN_HEIGHT; i++) {
              sunOffsets[i] = SUN_AMPLITUDE * (float)Math.sin(i * PERCENT);
            }
          }''',
          '''  public static final int SUN_HEIGHT = 92;
          public static final int SUN_PHASE_SUBDIVISIONS = 10;
          public static final int SUN_PHASE_STEPS = SUN_HEIGHT * SUN_PHASE_SUBDIVISIONS;
          public static final int SUN_ROW_PHASE_STRIDE = SUN_PHASE_SUBDIVISIONS;
          public static final int SUN_PHASE_ADVANCE = 3;
          public static final float SUN_AMPLITUDE = 2f;
          public static final float SUN_WAVES = 3f;
          public static final int WAVES_HEIGHT = 32;
                  
          public static final float[] sunOffsets = new float[SUN_PHASE_STEPS];
          
          static {    
            final float PERCENT = (float)(SUN_WAVES * 2 * Math.PI / SUN_PHASE_STEPS);
            
            for(int i = 0; i < SUN_PHASE_STEPS; i++) {
              sunOffsets[i] = SUN_AMPLITUDE * (float)Math.sin(i * PERCENT);
            }
          }''')

          replace_once(java,
          '''  public int sunOffset;
          public int sunOffsetCounter;''',
          '''  public int sunPhase;''')

          replace_once(java,
          '''    }    
          }''',
          '''    }
            
            if (state < STATE_PAUSED_2) {
              sunPhase += SUN_PHASE_ADVANCE;
              if (sunPhase >= SUN_PHASE_STEPS) {
                sunPhase -= SUN_PHASE_STEPS;
              }
            }
          }''')

          replace_once(java,
          '''    if (state < STATE_PAUSED_2) {
          
              if (++sunOffsetCounter == 2) {
                sunOffsetCounter = 0;
                if (++sunOffset == SUN_HEIGHT) {
                  sunOffset = 0;
                }
              }
              
              rotorAngle -= 30;''',
          '''    if (state < STATE_PAUSED_2) {
              rotorAngle -= 30;''')

          replace_once(java,
          '''    for(int i = 0, j = sunOffset; i < SUN_HEIGHT; i++) {
              main.draw(main.suns[i], 428 + sunOffsets[j], 356 + i);
              if (++j == SUN_HEIGHT) {
                j = 0;
              }
            }
            
            for(int i = 0, j = sunOffset; i < WAVES_HEIGHT; i++) {
              main.draw(main.waves[i], 428 + sunOffsets[j], 448 + i);
              if (++j == SUN_HEIGHT) {
                j = 0;
              }
            }''',
          '''    for(int i = 0, j = sunPhase; i < SUN_HEIGHT; i++) {
              main.draw(main.suns[i], 428 + sunOffsets[j], 356 + i);
              j += SUN_ROW_PHASE_STRIDE;
              if (j >= SUN_PHASE_STEPS) {
                j -= SUN_PHASE_STEPS;
              }
            }
            
            for(int i = 0, j = sunPhase; i < WAVES_HEIGHT; i++) {
              main.draw(main.waves[i], 428 + sunOffsets[j], 448 + i);
              j += SUN_ROW_PHASE_STRIDE;
              if (j >= SUN_PHASE_STEPS) {
                j -= SUN_PHASE_STEPS;
              }
            }''')

          ts = "pwa/src/jackal/SunsetMode.ts"
          replace_once(ts,
          '''    public static readonly SUN_HEIGHT: number = 92;
              public static readonly SUN_AMPLITUDE: number = 2;
              public static readonly SUN_WAVES: number = 3;
              public static readonly WAVES_HEIGHT: number = 32;
          
              public static readonly sunOffsets: number[] = javaArray(SunsetMode.SUN_HEIGHT, 0);
          
              static {
                  let PERCENT = javaFloat((javaFloat(SunsetMode.SUN_WAVES * 2) * Math.PI) / SunsetMode.SUN_HEIGHT);
          
                  for (let i = 0; i < SunsetMode.SUN_HEIGHT; i++) {
                      SunsetMode.sunOffsets[i] = javaFloat(SunsetMode.SUN_AMPLITUDE * javaFloat(Math.sin(javaFloat(i * PERCENT))));
                  }
              }''',
          '''    public static readonly SUN_HEIGHT: number = 92;
              public static readonly SUN_PHASE_SUBDIVISIONS: number = 10;
              public static readonly SUN_PHASE_STEPS: number = SunsetMode.SUN_HEIGHT * SunsetMode.SUN_PHASE_SUBDIVISIONS;
              public static readonly SUN_ROW_PHASE_STRIDE: number = SunsetMode.SUN_PHASE_SUBDIVISIONS;
              public static readonly SUN_PHASE_ADVANCE: number = 3;
              public static readonly SUN_AMPLITUDE: number = 2;
              public static readonly SUN_WAVES: number = 3;
              public static readonly WAVES_HEIGHT: number = 32;
          
              public static readonly sunOffsets: number[] = javaArray(SunsetMode.SUN_PHASE_STEPS, 0);
          
              static {
                  let PERCENT = javaFloat((javaFloat(SunsetMode.SUN_WAVES * 2) * Math.PI) / SunsetMode.SUN_PHASE_STEPS);
          
                  for (let i = 0; i < SunsetMode.SUN_PHASE_STEPS; i++) {
                      SunsetMode.sunOffsets[i] = javaFloat(SunsetMode.SUN_AMPLITUDE * javaFloat(Math.sin(javaFloat(i * PERCENT))));
                  }
              }''')

          replace_once(ts,
          '''    public sunOffset: number = 0;
              public sunOffsetCounter: number = 0;''',
          '''    public sunPhase: number = 0;''')

          replace_once(ts,
          '''        }
              }
          
              public fadeCompleted(): void {''',
          '''        }
          
                  if (this.state < SunsetMode.STATE_PAUSED_2) {
                      this.sunPhase += SunsetMode.SUN_PHASE_ADVANCE;
                      if (this.sunPhase >= SunsetMode.SUN_PHASE_STEPS) {
                          this.sunPhase -= SunsetMode.SUN_PHASE_STEPS;
                      }
                  }
              }
          
              public fadeCompleted(): void {''')

          replace_once(ts,
          '''        if (this.state < SunsetMode.STATE_PAUSED_2) {
                      if (++this.sunOffsetCounter === 2) {
                          this.sunOffsetCounter = 0;
                          if (++this.sunOffset === SunsetMode.SUN_HEIGHT) {
                              this.sunOffset = 0;
                          }
                      }
          
                      this.rotorAngle -= 30;''',
          '''        if (this.state < SunsetMode.STATE_PAUSED_2) {
                      this.rotorAngle -= 30;''')

          replace_once(ts,
          '''        for (let i = 0, j = this.sunOffset; i < SunsetMode.SUN_HEIGHT; i++) {
                      this.main.drawImage(this.main.suns[i], 428 + SunsetMode.sunOffsets[j], 356 + i);
                      if (++j === SunsetMode.SUN_HEIGHT) {
                          j = 0;
                      }
                  }
          
                  for (let i = 0, j = this.sunOffset; i < SunsetMode.WAVES_HEIGHT; i++) {
                      this.main.drawImage(this.main.waves[i], 428 + SunsetMode.sunOffsets[j], 448 + i);
                      if (++j === SunsetMode.SUN_HEIGHT) {
                          j = 0;
                      }
                  }''',
          '''        for (let i = 0, j = this.sunPhase; i < SunsetMode.SUN_HEIGHT; i++) {
                      this.main.drawImage(this.main.suns[i], 428 + SunsetMode.sunOffsets[j], 356 + i);
                      j += SunsetMode.SUN_ROW_PHASE_STRIDE;
                      if (j >= SunsetMode.SUN_PHASE_STEPS) {
                          j -= SunsetMode.SUN_PHASE_STEPS;
                      }
                  }
          
                  for (let i = 0, j = this.sunPhase; i < SunsetMode.WAVES_HEIGHT; i++) {
                      this.main.drawImage(this.main.waves[i], 428 + SunsetMode.sunOffsets[j], 448 + i);
                      j += SunsetMode.SUN_ROW_PHASE_STRIDE;
                      if (j >= SunsetMode.SUN_PHASE_STEPS) {
                          j -= SunsetMode.SUN_PHASE_STEPS;
                      }
                  }''')

          replace_once("pwa/src/jackal/persistence/GameStateFields.ts",
          '''export const SUNSET_MODE_FIELD_NAMES = fieldsOf<SunsetMode>()(
              "sunOffset",
              "sunOffsetCounter",''',
          '''export const SUNSET_MODE_FIELD_NAMES = fieldsOf<SunsetMode>()(
              "sunPhase",''')

          replace_once("pwa/src/jackal/persistence/GameStateSchema.ts",
          '''export const GAME_STATE_VERSION = 9 as const;
          export const FIRST_PUBLIC_GAME_STATE_VERSION = 9 as const;''',
          '''export const GAME_STATE_VERSION = 10 as const;
          export const FIRST_PUBLIC_GAME_STATE_VERSION = 10 as const;''')

          replace_once("scripts/test-public-release-hardening.mjs",
          '''test("schema 9 is explicitly the first public saved-game format", () => {
              const schema = read("pwa/src/jackal/persistence/GameStateSchema.ts");
              assert.match(schema, /GAME_STATE_VERSION = 9 as const/);
              assert.match(schema, /FIRST_PUBLIC_GAME_STATE_VERSION = 9 as const/);''',
          '''test("schema 10 is explicitly the first public saved-game format", () => {
              const schema = read("pwa/src/jackal/persistence/GameStateSchema.ts");
              assert.match(schema, /GAME_STATE_VERSION = 10 as const/);
              assert.match(schema, /FIRST_PUBLIC_GAME_STATE_VERSION = 10 as const/);''')

          replace_once("scripts/test-java-translation-parity-guardrails.mjs",
          '''    assert.match(schema, /GAME_STATE_VERSION\\s*=\\s*9/);''',
          '''    assert.match(schema, /GAME_STATE_VERSION\\s*=\\s*10/);''')

          replace_once("scripts/test-persistence-parity-coverage.mjs",
          '''    assert.match(schema, /GAME_STATE_VERSION\\s*=\\s*9/);''',
          '''    assert.match(schema, /GAME_STATE_VERSION\\s*=\\s*10/);''')

          Path("scripts/test-fixed-update-sunset-timing.mjs").write_text(r'''import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { join } from "node:path";
          import { test } from "node:test";
          import { rootDir } from "./build-utils.mjs";
          
          const read = (path) => readFileSync(join(rootDir, path), "utf8");
          
          function methodBody(source, signature, nextSignature) {
              const start = source.indexOf(signature);
              assert.ok(start >= 0, `Missing ${signature}.`);
              const end = nextSignature === null ? source.length : source.indexOf(nextSignature, start + signature.length);
              assert.ok(end > start, `Missing boundary after ${signature}.`);
              return source.slice(start, end);
          }
          
          test("sunset phase keeps the original spatial wave while sampling ten times more densely", () => {
              const java = read("desktop/src/jackal/SunsetMode.java");
              const ts = read("pwa/src/jackal/SunsetMode.ts");
          
              assert.match(java, /SUN_HEIGHT = 92/);
              assert.match(java, /SUN_PHASE_SUBDIVISIONS = 10/);
              assert.match(java, /SUN_PHASE_STEPS = SUN_HEIGHT \* SUN_PHASE_SUBDIVISIONS/);
              assert.match(java, /SUN_ROW_PHASE_STRIDE = SUN_PHASE_SUBDIVISIONS/);
              assert.match(java, /SUN_PHASE_ADVANCE = 3/);
              assert.match(java, /new float\[SUN_PHASE_STEPS\]/);
              assert.match(java, /SUN_WAVES \* 2 \* Math\.PI \/ SUN_PHASE_STEPS/);
          
              assert.match(ts, /SUN_HEIGHT: number = 92/);
              assert.match(ts, /SUN_PHASE_SUBDIVISIONS: number = 10/);
              assert.match(ts, /SUN_PHASE_STEPS: number = SunsetMode\.SUN_HEIGHT \* SunsetMode\.SUN_PHASE_SUBDIVISIONS/);
              assert.match(ts, /SUN_ROW_PHASE_STRIDE: number = SunsetMode\.SUN_PHASE_SUBDIVISIONS/);
              assert.match(ts, /SUN_PHASE_ADVANCE: number = 3/);
              assert.match(ts, /javaArray\(SunsetMode\.SUN_PHASE_STEPS, 0\)/);
              assert.match(ts, /Math\.PI\) \/ SunsetMode\.SUN_PHASE_STEPS/);
          
              const originalSpatialRadiansPerRow = (3 * 2 * Math.PI) / 92;
              const resampledSpatialRadiansPerRow = 10 * ((3 * 2 * Math.PI) / 920);
              assert.equal(resampledSpatialRadiansPerRow, originalSpatialRadiansPerRow);
          });
          
          test("sunset phase advances at exactly the intended 60-Hz-derived speed on the 100 TPS clock", () => {
              const subdivisions = 10;
              const phaseAdvance = 3;
              const fixedUpdatesPerSecond = 100;
              const originalPhasePositionsPerSecond = 60 / 2;
              const resampledPhasePositionsPerSecond = (phaseAdvance * fixedUpdatesPerSecond) / subdivisions;
              assert.equal(resampledPhasePositionsPerSecond, originalPhasePositionsPerSecond);
          
              const phaseSteps = 92 * subdivisions;
              const superperiodUpdates = phaseSteps;
              assert.equal((superperiodUpdates * phaseAdvance) % phaseSteps, 0);
              assert.equal(superperiodUpdates / fixedUpdatesPerSecond, 9.2);
              assert.equal((superperiodUpdates * phaseAdvance) / phaseSteps, 3);
          });
          
          test("Java and TypeScript advance sunset phase in update and render only samples it", () => {
              const java = read("desktop/src/jackal/SunsetMode.java");
              const ts = read("pwa/src/jackal/SunsetMode.ts");
          
              const javaUpdate = methodBody(java, "public void update(GameContainer gc)", "public void fadeCompleted()");
              const javaRender = methodBody(java, "public void render(GameContainer gc, Graphics g)", null);
              assert.match(javaUpdate, /sunPhase \+= SUN_PHASE_ADVANCE/);
              assert.match(javaUpdate, /if \(state < STATE_PAUSED_2\)/);
              assert.doesNotMatch(javaRender, /sunPhase\s*(?:\+\+|--|\+=|-=|=)/);
              assert.match(javaRender, /j = sunPhase/);
              assert.match(javaRender, /j \+= SUN_ROW_PHASE_STRIDE/);
          
              const tsUpdate = methodBody(ts, "public update(gc: GameContainer): void", "public fadeCompleted(): void");
              const tsRender = methodBody(ts, "public render(gc: GameContainer, g: Graphics): void", null);
              assert.match(tsUpdate, /this\.sunPhase \+= SunsetMode\.SUN_PHASE_ADVANCE/);
              assert.match(tsUpdate, /if \(this\.state < SunsetMode\.STATE_PAUSED_2\)/);
              assert.doesNotMatch(tsRender, /this\.sunPhase\s*(?:\+\+|--|\+=|-=|=)/);
              assert.match(tsRender, /j = this\.sunPhase/);
              assert.match(tsRender, /j \+= SunsetMode\.SUN_ROW_PHASE_STRIDE/);
          });
          ''', encoding="utf-8", newline="\n")
          PY

      - name: Format TypeScript and tests
        run: npx prettier pwa/src/jackal/SunsetMode.ts pwa/src/jackal/persistence/GameStateFields.ts pwa/src/jackal/persistence/GameStateSchema.ts scripts/test-fixed-update-sunset-timing.mjs scripts/test-public-release-hardening.mjs scripts/test-java-translation-parity-guardrails.mjs scripts/test-persistence-parity-coverage.mjs --write

      - name: Regenerate Java float metadata
        run: |
          npm run generate:java-float-metadata
          npm run generate:java-float-state

      - name: Verify source and parity tests
        run: |
          npm test
          npm run format:check
          npm run typecheck
          npm run check:java-float-parity

      - name: Commit sunset timing update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src/jackal/SunsetMode.java pwa/src/jackal/SunsetMode.ts pwa/src/jackal/persistence/GameStateFields.ts pwa/src/jackal/persistence/GameStateSchema.ts scripts/test-fixed-update-sunset-timing.mjs scripts/test-public-release-hardening.mjs scripts/test-java-translation-parity-guardrails.mjs scripts/test-persistence-parity-coverage.mjs scripts/java-float-parity/java-float-metadata.jsonl scripts/java-float-parity/java-float-state.json
          git commit -m "Move sunset wave timing to fixed updates"
          git push
