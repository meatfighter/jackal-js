name: Jackal Hardening Format Helper

on:
  push:
    branches:
      - chatgpt/jackal-prepublic-hardening-20260905
    paths:
      - .github/workflows/jackal-hardening-format-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/jackal-prepublic-hardening-20260905
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Update schema guardrails
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'scripts/test-java-translation-parity-guardrails.mjs',
              'scripts/test-persistence-parity-coverage.mjs',
          ]:
              path = Path(name)
              text = path.read_text()
              old = r'GAME_STATE_VERSION\s*=\s*10'
              new = r'GAME_STATE_VERSION\s*=\s*11'
              if text.count(old) != 1:
                  raise SystemExit(f'{name}: expected one old schema assertion, found {text.count(old)}')
              path.write_text(text.replace(old, new))
          PY
      - name: Format touched files
        run: |
          npx prettier --write \
            README.md \
            pwa/src/jackal/persistence/GameStateSchema.ts \
            pwa/src/jackal/persistence/GameStateStorage.ts \
            pwa/src/jackal/persistence/GameStateSnapshotValidator.ts \
            scripts/test-game-state-current-version.mjs \
            scripts/test-game-state-save-preservation.mjs \
            scripts/test-public-release-hardening.mjs \
            scripts/test-java-translation-parity-guardrails.mjs \
            scripts/test-persistence-parity-coverage.mjs
      - name: Commit patch
        run: |
          git config user.name "zeroone"
          git config user.email "54445200+meatfighter@users.noreply.github.com"
          git add README.md pwa/src/jackal/persistence scripts/test-game-state-current-version.mjs scripts/test-game-state-save-preservation.mjs scripts/test-public-release-hardening.mjs scripts/test-java-translation-parity-guardrails.mjs scripts/test-persistence-parity-coverage.mjs
          git commit -m "Complete Jackal pre-public hardening"
          git push origin HEAD:chatgpt/jackal-prepublic-hardening-20260905
