name: Refresh Slick lock

on:
  push:
    paths:
      - ".github/workflows/refresh-slick-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Switch Slick dependency to immutable HTTPS archive
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = "git+https://github.com/meatfighter/slick2d-ts.git#0bad1eb9f2b8ded61d4d6b82b9a4282c4a62b9ee"
          new = "https://codeload.github.com/meatfighter/slick2d-ts/tar.gz/0bad1eb9f2b8ded61d4d6b82b9a4282c4a62b9ee"

          package = Path("package.json")
          text = package.read_text()
          if text.count(old) != 1:
              raise SystemExit(f"Expected one old Slick dependency in package.json, found {text.count(old)}")
          package.write_text(text.replace(old, new))

          replacements = {
              "scripts/test-buffered-scaling-wiring.mjs": (
                  r"^git\\+https:\\/\\/github\\.com\\/meatfighter\\/slick2d-ts\\.git#[0-9a-f]{40}$",
                  r"^https:\\/\\/codeload\\.github\\.com\\/meatfighter\\/slick2d-ts\\/tar\\.gz\\/[0-9a-f]{40}$",
              ),
              "scripts/test-public-release-hardening.mjs": (
                  r"^git\\+https:\\/\\/github\\.com\\/meatfighter\\/slick2d-ts\\.git#[0-9a-f]{40}$",
                  r"^https:\\/\\/codeload\\.github\\.com\\/meatfighter\\/slick2d-ts\\/tar\\.gz\\/[0-9a-f]{40}$",
              ),
          }
          for path, (before, after) in replacements.items():
              file = Path(path)
              source = file.read_text()
              if source.count(before) != 1:
                  raise SystemExit(f"Expected one dependency regex in {path}, found {source.count(before)}")
              file.write_text(source.replace(before, after))
          PY
      - run: npm install --package-lock-only --ignore-scripts
      - name: Validate canonical Slick lock metadata
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = pkg.dependencies['slick2d-ts'];
          const root = lock.packages[''].dependencies['slick2d-ts'];
          const resolved = lock.packages['node_modules/slick2d-ts'].resolved;
          if (root !== expected || resolved !== expected) {
            throw new Error(`Unexpected Slick lock metadata: expected ${expected}, root=${root}, resolved=${resolved}`);
          }
          if (!/^https:\/\/codeload\.github\.com\/meatfighter\/slick2d-ts\/tar\.gz\/[0-9a-f]{40}$/.test(expected)) {
            throw new Error(`Unexpected Slick archive URL: ${expected}`);
          }
          EOF
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Commit archive pin, refreshed lock, and remove helper
        run: |
          rm .github/workflows/refresh-slick-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json scripts/test-buffered-scaling-wiring.mjs scripts/test-public-release-hardening.mjs .github/workflows/refresh-slick-lock.yml
          git diff --cached --check
          git commit -m "Pin slick2d-ts via immutable HTTPS archive"
          git push
