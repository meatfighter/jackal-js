<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="__DESCRIPTION__" />
        <meta name="application-name" content="Jackal" />
        <meta name="jackal:version" content="__APP_VERSION__" />
        <meta name="jackal:build-stamp" content="__BUILD_STAMP__" />
        <link rel="canonical" href="__CANONICAL_URL__" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="meatfighter.com" />
        <meta property="og:title" content="Jackal" />
        <meta property="og:description" content="__DESCRIPTION__" />
        <meta property="og:url" content="__CANONICAL_URL__" />
        <meta property="og:image" content="__SOCIAL_IMAGE_URL__" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Jackal" />
        <meta name="twitter:description" content="__DESCRIPTION__" />
        <meta name="twitter:image" content="__SOCIAL_IMAGE_URL__" />
        <link rel="stylesheet" href="./styles.css?v=__BUILD_STAMP_ENCODED__" />
        <link rel="icon" href="./assets/icon.png?v=__BUILD_STAMP_ENCODED__" type="image/png" sizes="512x512" />
        <link rel="apple-touch-icon" href="./assets/icon.png?v=__BUILD_STAMP_ENCODED__" sizes="512x512" />
        <title>Jackal - Play Browser PWA and Download Desktop ZIP</title>
        <script>
            (() => {
                try {
                    const theme = localStorage.getItem("jackal-about-theme");
                    if (theme === "dark" || theme === "light") {
                        document.documentElement.dataset.theme = theme;
                    }
                } catch {
                    // Keep the default theme when storage is unavailable.
                }
            })();
        </script>
    </head>
    <body>
        <div class="page">
            <header class="site-header">
                <div class="site-header__inner">
                    <h1 class="site-title">
                        <a class="site-logo-link" href="./" aria-label="Jackal">
                            <img class="site-logo" src="./__TITLE_IMAGE__" alt="Jackal" width="2172" height="724" decoding="async" />
                        </a>
                    </h1>
                    <label class="theme-switch" for="theme-toggle">
                        <span class="sr-only">Toggle dark mode</span>
                        <input id="theme-toggle" type="checkbox" role="switch" aria-label="Toggle dark mode" />
                        <span class="theme-switch__track" aria-hidden="true"></span>
                    </label>
                </div>
            </header>

            <main id="main" class="site-main">
                <article class="article" aria-label="About Jackal">__ARTICLE_HTML__</article>
            </main>

            <footer class="site-footer">
                <div class="site-footer__inner">
                    <div class="site-footer__left">
                        <p>&copy; 2026 meatfighter.com</p>
                        <p>
                            This content is licensed under
                            <a class="license-link" href="https://creativecommons.org/licenses/by-sa/4.0/?ref=chooser-v1" rel="license">CC BY-SA 4.0</a>
                        </p>
                    </div>
                </div>
            </footer>
        </div>

        <script src="./theme.js?v=__BUILD_STAMP_ENCODED__"></script>
    </body>
</html>
